# ==========================================================================
#  四、TCPMUX 穿透（type = tcpmux）—— 走 tcpmuxHTTPConnectPort(8333)，按域名路由
#  ★ 不需要 remote_port；多个 tcpmux 代理可共用 8333
#  ★ 需要 frpc >= 0.35（本项目的 0.62.0 没问题）
#  ★ 使用方式：把 8333 当 HTTP CONNECT 代理用
# ==========================================================================
# [tcpmux-dev]
# type = tcpmux
# multiplexer = httpconnect
# local_ip = 127.0.0.1
# local_port = 3000
# custom_domains = dev.your-domain.com
# 使用：curl -x http://dev.your-domain.com:8333 https://example.com/


# ==========================================================================
#  五、STCP / SUDP（安全穿透）—— 公网上不留端口，靠 secretKey 鉴权
#  ★ 不需要 remote_port，也不占 allowPorts 槽位
#  ★ 被访问方写下面的代理；访问方另起一个 frpc 写 [secret-ssh-visitor] 那段
# ==========================================================================
# [secret-ssh]
# type = stcp              # SUDP 改成 sudp
# secretKey = 换成一串够长的随机串
# local_ip = 127.0.0.1
# local_port = 22

# ---- 下面这段给「访问方」用，放在访问方自己那台机器的 frpc.ini 里 ----
# [common]
# server_addr = frp-tidy-coral-6267.fly.dev
# server_port = 7000
# token = 与服务端 FRP_AUTH_TOKEN 一致
#
# [secret-ssh-visitor]
# type = stcp              # 与被访问方的 type 一致（sudp 对 sudp）
# role = visitor
# server_name = secret-ssh
# secretKey = 与被访问方相同
# bind_addr = 127.0.0.1
# bind_port = 6000         # 本地端口，随便选
# 连接：ssh -p 6000 用户名@127.0.0.1
