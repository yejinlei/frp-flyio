# ==========================================================================
#  frpc.ini —— 与主实例 frps.toml 严格对齐（TCP / HTTP / HTTPS / TCPMUX / STCP / SUDP）
#  最后更新：2026-10-04
#
#  frps 端规则：
#    bindPort              = 7000   （控制端口，本文件 server_port 对应它）
#    vhostHTTPPort         = 8080   （type = http  走这里，按域名路由）
#    vhostHTTPSPort        = 8443   （type = https 走这里，按域名路由）
#    tcpmuxHTTPConnectPort = 8333   （type = tcpmux + httpconnect 走这里，按域名路由）
#    allowPorts            = 6000-6004 / 8081-8084 / 8444-8447
#                            （这些才是 type = tcp 能申请的 remote_port）
#  STCP / SUDP / TCPMUX 不走 allowPorts，也不需要申请端口槽位。
#
#  ⚠️ 版本：本目录的 frpc.exe 是 0.62.0，与服务端（Dockerfile 的 FRP_VERSION）一致。
#     frpc 与 frps 跨大版本连不上（握手/登录阶段就失败）；
#     升级服务端时，同步把 exe 换成同一版本（frpc.ini 不用改）：
#     https://github.com/fatedier/frp/releases/download/v<版本>/frp_<版本>_windows_amd64.zip
#     旧版 frpc（0.33 及以下）不支持 type = tcpmux。
#
#  注：frps 主实例不放行 UDP，本文件不含 type = udp 的代理。
#      要穿 UDP 请另建一份 ini：server_port = 7001（UDP 专用实例，端口 6100-6104）。
# ==========================================================================

[common]
# 控制端口连接地址。TCP 类端口建议填「专用 IPv4」更稳；仪表盘/HTTP 域名用它也可
server_addr = frp-tidy-coral-6267.fly.dev
server_port = 7000
tls_enable = true
# 必须与服务端 FRP_AUTH_TOKEN 完全一致（留空会连不上）
token = 
log_file = ./frpc.log
log_level = info
log_max_days = 3


# ==========================================================================
#  一、HTTP 穿透（type = http）—— 走 vhostHTTPPort(8080)，靠域名路由
#  ★ 不需要 remote_port；访问时用「域名」，不要带端口号
#  ★ 前提：fly.toml 的 [http_service] 的 internal_port 必须指向 8080
# ==========================================================================
# [web-http]
# type = http
# local_ip = 127.0.0.1
# local_port = 8000
# custom_domains = frp-tidy-coral-6267.fly.dev
# 访问：https://frp-tidy-coral-6267.fly.dev


# ==========================================================================
#  二、HTTPS 穿透（type = https）—— 走 vhostHTTPSPort(8443)，靠域名(SNI)路由
#  ★ 不需要 remote_port；访问 https://域名:8443
# ==========================================================================
# [web-https]
# type = https
# local_ip = 127.0.0.1
# local_port = 8000
# custom_domains = frp-tidy-coral-6267.fly.dev
# 访问：https://frp-tidy-coral-6267.fly.dev:8443


# ==========================================================================
#  三、TCP 穿透（type = tcp）—— remote_port 必须落在 allowPorts 范围内
#  可申请端口：6000-6004、8081-8084、8444-8447
#  访问方式：<域名或专用 IPv4>:端口
#    实测两者都可用：frp-tidy-coral-6267.fly.dev:6000  /  66.51.123.39:6000
#    专用 IPv4 见 fly ips list（当前是 66.51.123.39）
# ==========================================================================

# ---- 你现在正在用的：把本机 8000 的 Web 服务暴露出去 ----
[web-tcp]
type = tcp
local_ip = 127.0.0.1
local_port = 8000
remote_port = 8081
# 访问：http://66.51.123.39:8081

# ---- 穿 SSH（本机 22）----
[ssh]
type = tcp
local_ip = 127.0.0.1
local_port = 22
remote_port = 6000
# 访问：ssh -p 6000 用户名@66.51.123.39

# ---- 穿远程桌面 RDP（本机 3389）----
[rdp]
type = tcp
local_ip = 127.0.0.1
local_port = 3389
remote_port = 6001
# 访问：mstsc 连接 66.51.123.39:6001

# ---- 穿 MySQL（本机 3306）----
[mysql]
type = tcp
local_ip = 127.0.0.1
local_port = 3306
remote_port = 6002

