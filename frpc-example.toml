# frpc-example.toml —— 本地客户端配置示例（TCP / HTTP / HTTPS）
# 复制为 frpc.toml，修改下面的占位符后运行：./frpc -c frpc.toml
#
# 服务端可用端口（每组 5 个连续端口）：
#   TCP   6000-6004   type = "tcp"
#   HTTP  8080-8084   8080 用 type = "http"（按域名路由），8081-8084 用 type = "tcp"
#   HTTPS 8443-8447   8443 用 type = "https"（按域名路由），8444-8447 用 type = "tcp"
#   TCPMUX 8333    type = "tcpmux" + multiplexer = "httpconnect"（按域名路由）
#
# 另外不需要服务端改配置、纯客户端可用的：STCP / SUDP（配 visitor 即可）。

serverAddr = "your-app-name.fly.dev"   # 改成你自己的 fly.io 域名
serverPort = 7000

auth.method = "token"
auth.token = "把这里替换成你 fly secrets set FRP_AUTH_TOKEN 时设置的相同值"

# 日志
log.to = "./frpc.log"
log.level = "info"
log.maxDays = 3

# --- 示例 1：TCP，穿透本地 SSH（22 → 远端 6000） ---
[[proxies]]
name = "ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 6000
# 连接：ssh -p 6000 用户名@your-app-name.fly.dev

# --- 示例 2：TCP，穿透本地 Web 开发站（3000 → 远端 6001） ---
[[proxies]]
name = "web-dev-tcp"
type = "tcp"
localIP = "127.0.0.1"
localPort = 3000
remotePort = 6001
# 访问：http://your-app-name.fly.dev:6001

# --- 示例 3：TCP，穿透 Windows 远程桌面（3389 → 远端 6002） ---
# [[proxies]]
# name = "rdp"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 3389
# remotePort = 6002

# --- 示例 4：HTTP，走 vhost 端口 8080（按域名路由，可多站点共用一个端口） ---
# 前提：dev.your-domain.com 解析到你的 fly 应用（CNAME 到 your-app-name.fly.dev）
# [[proxies]]
# name = "web-dev-http"
# type = "http"
# localIP = "127.0.0.1"
# localPort = 3000
# customDomains = ["dev.your-domain.com"]
# 访问：http://dev.your-domain.com:8080

# --- 示例 5：HTTP，直接用裸 TCP 端口 8081（不需要配域名） ---
[[proxies]]
name = "web-dev-8081"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8080
remotePort = 8081
# 访问：http://your-app-name.fly.dev:8081

# --- 示例 6：HTTPS，走 vhost 端口 8443（frps 按 SNI 透传，不解密） ---
# [[proxies]]
# name = "web-https"
# type = "https"
# localIP = "127.0.0.1"
# localPort = 443
# customDomains = ["dev.your-domain.com"]
# 访问：https://dev.your-domain.com:8443

# --- 示例 7：HTTPS，直接用裸 TCP 端口 8444 ---
# [[proxies]]
# name = "web-https-8444"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 443
# remotePort = 8444
# 访问：https://your-app-name.fly.dev:8444

# --- 示例 8：TCPMUX，走 tcpmuxHTTPConnectPort = 8333（HTTP CONNECT 多路复用）---
# 与 http 一样按域名路由，不需要 remotePort；一台 frpc 可挂多个不同 customDomains 的 tcpmux 代理，
# 共用 8333 一个端口。前提：dev.your-domain.com 解析到你的 fly 应用。
# [[proxies]]
# name = "tcpmux-dev"
# type = "tcpmux"
# multiplexer = "httpconnect"
# localIP = "127.0.0.1"
# localPort = 3000
# customDomains = ["dev.your-domain.com"]
# 使用：curl -x http://dev.your-domain.com:8333 https://任意目标/

# --- 示例 9：STCP（安全 TCP，服务端不需要额外配置端口）---
# 只有知道 secretKey 的 visitor 能访问，公网没有任何端口暴露。
# 内网机（被访问方）加这段；访问方另起一个 frpc 写 [[visitors]]（见示例 10）。
# [[proxies]]
# name = "secret-ssh"
# type = "stcp"
# secretKey = "换成一串够长的随机串"
# localIP = "127.0.0.1"
# localPort = 22

# --- 示例 10：访问方 frpc 的 visitor 配置（与示例 9 配对）---
# type = "sudp" 时用法完全一样，只是访问下层的 UDP 服务。
# [[visitors]]
# name = "secret-ssh-visitor"
# type = "stcp"          # SUDP 用 "sudp"
# serverName = "secret-ssh"
# secretKey = "与示例 9 相同"
# bindAddr = "127.0.0.1"
# bindPort = 6000        # 本地端口，随便选，不占用服务端端口
# 连接：ssh -p 6000 用户名@127.0.0.1
