# frpc-example.toml —— 本地客户端配置示例
# 复制为 frpc.toml，修改下面的占位符后运行：./frpc -c frpc.toml

serverAddr = "your-app-name.fly.dev"   # 改成你自己的 fly.io 域名
serverPort = 7000

auth.method = "token"
auth.token = "把这里替换成你 fly secrets set FRP_AUTH_TOKEN 时设置的相同值"

# 日志
log.to = "./frpc.log"
log.level = "info"
log.maxDays = 3

# --- 示例 1：穿透本地 SSH（22 → 远端 6022） ---
[[proxies]]
name = "ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 6022
# 注意：使用 remotePort 必须在 fly.toml 中新增对应 [[services]] 块开放该端口

# --- 示例 2：穿透本地 Web 服务（如本地 3000 端口的开发站） ---
# [[proxies]]
# name = "web-dev"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 3000
# remotePort = 6300
# 然后通过 http://your-app-name.fly.dev:6300 访问

# --- 示例 3：穿透 RDP (Windows 远程桌面，3389 → 远端 6389) ---
# [[proxies]]
# name = "rdp"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 3389
# remotePort = 6389
