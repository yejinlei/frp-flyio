# --- frps 服务端配置 (fly.io 部署用) ---
# 注意：敏感字段通过 ${VAR} 从环境变量读取，不要在此文件中写真实密码

# 服务端监听地址和端口
bindAddr = "0.0.0.0"
bindPort = 7000

# --- 身份认证 ---
auth.method = "token"
# 从环境变量 FRP_AUTH_TOKEN 读取（由 fly secrets 注入）
auth.token = "${FRP_AUTH_TOKEN}"

# --- Web 管理仪表盘 ---
webServer.addr = "0.0.0.0"
webServer.port = 7500
webServer.user = "${FRP_DASHBOARD_USER}"
webServer.password = "${FRP_DASHBOARD_PWD}"

# --- 日志配置 ---
log.to = "console"
log.level = "info"
log.maxDays = 3
log.disablePrintColor = true

# --- 传输层配置 ---
# 启用心跳检测，保持长连接稳定
transport.heartbeatTimeout = 90
transport.tcpMuxKeepaliveInterval = 60

# --- 端口范围限制 (可选，防止滥用) ---
# allowPorts = [
#   { start = 6000, end = 6100 },
# ]

# --- HTTP/HTTPS 穿透端口 (按需开启) ---
# vhostHTTPPort = 8080
# vhostHTTPSPort = 8443
