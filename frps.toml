# frps.toml 模板 —— 启动时由 entrypoint.sh 通过 envsubst 注入环境变量
# 不要把真实密码写在这里；通过 fly secrets set 注入。

bindAddr = "0.0.0.0"
bindPort = 7000

# --- 认证 ---
auth.method = "token"
auth.token = "${FRP_AUTH_TOKEN}"

# --- Web 仪表盘 ---
webServer.addr = "0.0.0.0"
webServer.port = 7500
webServer.user = "${FRP_DASHBOARD_USER}"
webServer.password = "${FRP_DASHBOARD_PWD}"

# --- 日志 ---
log.to = "console"
log.level = "info"
log.maxDays = 3

# 如需 HTTP/HTTPS 穿透，取消注释并在 fly.toml 中开放对应端口
# vhostHTTPPort = 8080
# vhostHTTPSPort = 8443
