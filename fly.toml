# fly.toml —— frps 部署配置
# 初始化时 fly launch 会把 app 字段改成你自己的应用名

app = "frp"          # 首次 fly launch 时会提示修改，可随便改
primary_region = "sin"     # 可选：nrt(东京) / sin(新加坡) / hkg(香港) / sjc(圣何塞) / iad(华盛顿)

[build]

[env]
  # 这里可放非敏感默认值；密钥一定用 fly secrets set 设置
  FRP_DASHBOARD_USER = "admin"

[http_service]
  internal_port = 7500
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/static/"

# --- frp 控制端口 7000 (TCP) ---
[[services]]
  protocol = "tcp"
  internal_port = 7000
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7000

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"

