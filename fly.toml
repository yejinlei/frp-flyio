# fly.toml app configuration file generated for frp-tidy-coral-6267 on 2026-10-04T14:26:35+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# 端口规划（每组 5 个连续端口，外部端口 = 容器内部端口，frps 直接监听同名端口）：
#   TCP   穿透 6000-6004  → frpc type = "tcp",   remotePort = 6000..6004
#   UDP   穿透 6100-6104  → frpc type = "udp",   remotePort = 6100..6104（需独立 IPv4）
#   HTTP  穿透 8080-8084  → 8080 = vhostHTTPPort（type="http"，按域名路由）
#                           8081-8084 = 裸 TCP（type="tcp"，http://域名:8081）
#   HTTPS 穿透 8443-8447  → 8443 = vhostHTTPSPort（type="https"，按域名路由）
#                           8444-8447 = 裸 TCP（type="tcp"，https://域名:8444）
#   TCPMUX 穿透 8333  → frpc type = "tcpmux", multiplexer = "httpconnect"，
#                       按 customDomains 路由，不占 remotePort
#   控制端口 7000 = 主实例（tcp/http/https/tcpmux/stcp/sudp），7001 = UDP 实例
#
# ⚠️ UDP 需要独立 IPv4（共享 IPv4 / IPv6 不支持 UDP）：fly ips allocate-v4

app = 'frp-tidy-coral-6267'
primary_region = 'sin'

[build]
[env]
  FRP_DASHBOARD_USER = 'admin'

# 80/443 → frps 仪表盘（webServer.port = 7500）
[http_service]
  internal_port = 7500
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    # frps 仪表盘唯一免鉴权的健康检查端点；/static/ 需要登录，会让机器永远 unhealthy
    path = '/healthz'

# ============================ 控制端口 ============================

# frps 主实例（TCP / HTTP / HTTPS 代理）
[[services]]
  protocol = 'tcp'
  internal_port = 7000
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7000

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

# frps UDP 实例（UDP 专用，代理绑 fly-global-services）
[[services]]
  protocol = 'tcp'
  internal_port = 7001
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7001

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

