# fly.toml app configuration file generated for frp-tidy-coral-6267
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# 端口规划（2026-10-05 扩容为每组 20 个连续端口，外部端口 = 容器内部端口，frps 直接监听同名端口）：
#   TCP    6000-6019  -> frpc type = "tcp",   remotePort = 6000..6019
#   UDP    6100-6119  -> frpc type = "udp",   remotePort = 6100..6119（连 7001 实例，需独立 IPv4）
#   HTTP   8080-8099  -> 8080 = vhostHTTPPort（type = "http"，按域名路由）
#                        8081-8099 = 裸 TCP（type = "tcp"，http://域名:8081）
#   HTTPS  8443-8462  -> 8443 = vhostHTTPSPort（type = "https"，按域名路由）
#                        8444-8462 = 裸 TCP（type = "tcp"，https://域名:8444）
#   TCPMUX 8333       -> type = "tcpmux" + multiplexer = "httpconnect"（按域名路由，不占 remotePort）
#   控制端口 7000 = 主实例（tcp / http / https / tcpmux / stcp / sudp / xtcp），7001 = UDP 实例
#
# frps 的 sshTunnelGateway(2200) 只在容器内监听，故意不在 fly.toml 发布（避免公网无鉴权暴露，
# 见 README「SSH 隧道网关」一节）；要用时执行 flyctl proxy 2200:2200。
#
# ⚠️ UDP 需要独立 IPv4（共享 IPv4 / IPv6 不支持 UDP）：fly ips allocate-v4

app = 'frp-tidy-coral-6267'
primary_region = 'sin'

[build]
[env]
  FRP_DASHBOARD_USER = 'admin'

# 80/443 -> frps 仪表盘（webServer.port = 7500）
[http_service]
  internal_port = 7500
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    # frps 仪表盘唯一免鉴权的健康检查端点；/static/ 需要登录，会让机器永远 unhealthy
    path = '/healthz'

# ============================ 控制端口 ============================
# frps 主实例（TCP / HTTP / HTTPS / TCPMUX / STCP / SUDP / XTCP）

[[services]]
  protocol = 'tcp'
  internal_port = 7000
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7000

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

# frps UDP 实例（UDP 专用，代理绑 fly-global-services）

[[services]]
  protocol = 'tcp'
  internal_port = 7001
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7001

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

